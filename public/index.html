<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="joinForm" class="container">
        <input type="text" id="name" placeholder="NAME">
        <input type="text" id="skills" placeholder="Skills to learn">
        <input type="text" id="knowSkill" placeholder="Known Skills">
        <button id="join">JOIN</button>
    </div>

    <div id="lobby">
        <div id="requestBox"></div>
        <h2>People Online</h2>
        <ul id="userList"></ul>

        <h2>General Chat</h2>
        <div id="chatBox"></div>
        <input type="text" id="chatInput" placeholder="Message">
        <button id="send">Send</button>
    </div>

    <div id="room">
        <h2 id="roomTitle"></h2>
        <div class="videos">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <button id="shareBtn">Share Screen</button>
        <button id="leaveBtn">Leave Room</button>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- ADDED: your own JavaScript now lives in this file. It must come LAST -->
    <script src="/script.js"></script>
</body>
</html>
